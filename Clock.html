<!DOCTYPE html>
<html style="height:100%; margin:0; padding:0">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <title>Clock</title>
        <style type="text/css">
            /* Customizable font and colors */
            html {
                background: #000000;
                font-family: sans-serif;
                font-weight: bold;
                color: #FFFFFF;
            }
            #clocktext {
                font-kerning: none;
                transition: transform 3s ease-in-out;
                will-change: transform;
            }
        </style>
    </head>
    
    <body style="display:flex; height:100%; margin:0; padding:0; justify-content:center; align-items:center; overflow:hidden">
        <span id="clocktext"></span>
        
        <script>
            "use strict";
            
            let textElem = document.getElementById("clocktext");
            const targetWidth = 0.8;
            let curFontSize = 15;
            let lastMinute = -1;
            
            function updatePosition() {
                const textHeight = textElem.offsetHeight;
                const viewportHeight = window.innerHeight;
                
                /*
                  Body centers the element at 50% height.
                  A 5% margin from top and bottom leaves 45% max displacement from center.
                  Subtracting half the element height ensures edges never cross the 5% margins.
                */
                const maxOffset = Math.max(0, 0.45 * viewportHeight - textHeight / 2);
                const randomOffset = (Math.random() * 2 - 1) * maxOffset;
                
                textElem.style.transform = `translateY(${randomOffset}px)`;
            }
            
            function updateClock() {
                const d = new Date();
                const minutes = d.getMinutes();
                
                if (minutes !== lastMinute) {
                    lastMinute = minutes;
                    updatePosition();
                }
                
                let s = "";
                s += (10 > d.getHours  () ? "0" : "") + d.getHours  () + ":";
                s += (10 > d.getMinutes() ? "0" : "") + d.getMinutes() + ":";
                s += (10 > d.getSeconds() ? "0" : "") + d.getSeconds();
                textElem.textContent = s;
                setTimeout(updateClock, 1000 - d.getTime() % 1000 + 20);
            }
            
            function updateTextSize() {
                for (let i = 0; 3 > i; i++) {  // Iterate for better convergence
                    curFontSize *= targetWidth / (textElem.offsetWidth / textElem.parentNode.offsetWidth);
                    textElem.style.fontSize = curFontSize + "pt";
                }
                updatePosition();
            }
            
            updateClock();
            updateTextSize();
            window.addEventListener("resize", updateTextSize);
        </script>
    </body>
</html>
