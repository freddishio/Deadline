<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monochrome Telemetry & Weather Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #burn-wrapper {
            width: 92vw;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 28px;
            background: rgba(10, 10, 10, 0.9);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            will-change: transform;
            transition: transform 4s cubic-bezier(0.25, 1, 0.5, 1);
            font-variant-numeric: tabular-nums;
        }

        #orbit-layer {
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: transform 1.5s ease;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #666666;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 12px;
        }

        .location-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #FFFFFF;
            font-weight: 700;
            letter-spacing: 0.18em;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: #FFFFFF;
            border-radius: 50%;
            animation: pulse-op 2s infinite ease-in-out;
        }

        @keyframes pulse-op {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .time-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 0;
        }

        .clock-digits {
            display: flex;
            align-items: baseline;
            justify-content: center;
            font-weight: 800;
            line-height: 0.88;
        }

        .main-time {
            font-size: clamp(3.8rem, 14vw, 8rem);
            letter-spacing: -0.04em;
            color: #FFFFFF;
        }

        .main-secs {
            font-size: clamp(1.6rem, 5vw, 3.2rem);
            color: #666666;
            margin-left: 10px;
            font-weight: 400;
        }

        .date-display {
            margin-top: 14px;
            font-size: clamp(0.85rem, 2vw, 1.15rem);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #888888;
            font-weight: 600;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr;
            gap: 12px;
            border-top: 1px solid #1a1a1a;
            padding-top: 16px;
        }

        .weather-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .weather-card.current {
            border-right: 1px solid #1a1a1a;
            padding-right: 12px;
        }

        .card-label {
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #555555;
            font-weight: 700;
        }

        .card-temp-main {
            font-size: 1.8rem;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1;
        }

        .card-condition {
            font-size: 0.75rem;
            color: #888888;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .card-details {
            font-size: 0.68rem;
            color: #555555;
            display: flex;
            gap: 8px;
        }

        .forecast-day {
            font-size: 0.72rem;
            font-weight: 600;
            color: #AAAAAA;
            text-transform: uppercase;
        }

        .forecast-temp {
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFFFFF;
        }

        .forecast-range {
            font-size: 0.65rem;
            color: #666666;
        }
    </style>
</head>
<body>

    <div id="burn-wrapper">
        <div id="orbit-layer">
            <div class="header-row">
                <div class="location-badge">
                    <div class="pulse-dot"></div>
                    <span id="val-city">LOCATING...</span>
                </div>
                <div>
                    <span>WEEK <span id="val-week" style="color:#aaa">--</span></span>
                    <span style="margin-left:12px">DOY <span id="val-doy" style="color:#aaa">---</span></span>
                </div>
            </div>

            <div class="time-section">
                <div class="clock-digits">
                    <span id="val-time" class="main-time">00:00</span>
                    <span id="val-secs" class="main-secs">:00</span>
                </div>
                <div id="val-date" class="date-display">INITIALIZING DATE</div>
            </div>

            <div class="weather-grid">
                <div class="weather-card current">
                    <div class="card-label">CURRENT WEATHER</div>
                    <div id="cur-temp" class="card-temp-main">--°</div>
                    <div id="cur-cond" class="card-condition">FETCHING DATA</div>
                    <div class="card-details">
                        <span>WIND: <b id="cur-wind" style="color:#aaa">--</b></span>
                        <span>HUM: <b id="cur-hum" style="color:#aaa">--</b></span>
                    </div>
                </div>

                <div class="weather-card">
                    <div id="day-1-name" class="forecast-day">TOMORROW</div>
                    <div id="day-1-temp" class="forecast-temp">--°</div>
                    <div id="day-1-cond" class="card-condition">--</div>
                    <div id="day-1-range" class="forecast-range">L: --° H: --°</div>
                </div>

                <div class="weather-card">
                    <div id="day-2-name" class="forecast-day">DAY 2</div>
                    <div id="day-2-temp" class="forecast-temp">--°</div>
                    <div id="day-2-cond" class="card-condition">--</div>
                    <div id="day-2-range" class="forecast-range">L: --° H: --°</div>
                </div>

                <div class="weather-card">
                    <div id="day-3-name" class="forecast-day">DAY 3</div>
                    <div id="day-3-temp" class="forecast-temp">--°</div>
                    <div id="day-3-cond" class="card-condition">--</div>
                    <div id="day-3-range" class="forecast-range">L: --° H: --°</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        const wrapper = document.getElementById("burn-wrapper");
        const orbitLayer = document.getElementById("orbit-layer");
        const timeElem = document.getElementById("val-time");
        const secsElem = document.getElementById("val-secs");
        const dateElem = document.getElementById("val-date");
        const cityElem = document.getElementById("val-city");
        const weekElem = document.getElementById("val-week");
        const doyElem = document.getElementById("val-doy");

        let lastMinute = -1;
        let userCoords = null;

        function interpretWMO(code) {
            if (code === 0) return "Clear Sky";
            if (code === 1) return "Mainly Clear";
            if (code === 2) return "Partly Cloudy";
            if (code === 3) return "Overcast";
            if (code >= 45 && code <= 48) return "Fog Formation";
            if (code >= 51 && code <= 55) return "Drizzle";
            if (code >= 61 && code <= 65) return "Rain Showers";
            if (code >= 71 && code <= 77) return "Snow Precipitation";
            if (code >= 80 && code <= 82) return "Heavy Showers";
            if (code >= 95 && code <= 99) return "Thunderstorm";
            return "Varied Skies";
        }

        function triggerPixelOrbit() {
            const ox = (Math.random() * 4 - 2).toFixed(1);
            const oy = (Math.random() * 4 - 2).toFixed(1);
            orbitLayer.style.transform = `translate(${ox}px, ${oy}px)`;
        }
        setInterval(triggerPixelOrbit, 10000);

        function updatePosition() {
            const cardHeight = wrapper.offsetHeight;
            const viewportHeight = window.innerHeight;
            
            const maxOffset = Math.max(0, 0.45 * viewportHeight - cardHeight / 2);
            const randomOffsetY = (Math.random() * 2 - 1) * maxOffset;
            const randomOffsetX = (Math.random() * 2 - 1) * 15;
            
            wrapper.style.transform = `translate(${randomOffsetX.toFixed(1)}px, ${randomOffsetY.toFixed(1)}px)`;
        }

        async function fetchExactCity(lat, lon) {
            try {
                const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                const data = await res.json();
                const city = data.city || data.locality || data.principalSubdivision || "LOCAL AREA";
                const region = data.principalSubdivisionCode ? data.principalSubdivisionCode.split("-").pop() : "";
                cityElem.textContent = region ? `${city}, ${region}` : city;
            } catch (err) {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                cityElem.textContent = tz.split("/").pop().replace(/_/g, " ").toUpperCase();
            }
        }

        async function fetchWeather(lat, lon) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=4`;
                const res = await fetch(url);
                const data = await res.json();

                document.getElementById("cur-temp").textContent = `${Math.round(data.current.temperature_2m)}°F`;
                document.getElementById("cur-cond").textContent = interpretWMO(data.current.weather_code);
                document.getElementById("cur-wind").textContent = `${Math.round(data.current.wind_speed_10m)} MPH`;
                document.getElementById("cur-hum").textContent = `${data.current.relative_humidity_2m}%`;

                const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
                for (let i = 1; i <= 3; i++) {
                    const dateObj = new Date(data.daily.time[i] + "T00:00:00");
                    const dayName = days[dateObj.getDay()];
                    const maxT = Math.round(data.daily.temperature_2m_max[i]);
                    const minT = Math.round(data.daily.temperature_2m_min[i]);
                    const code = data.daily.weather_code[i];

                    document.getElementById(`day-${i}-name`).textContent = (i === 1) ? "TOMORROW" : dayName;
                    document.getElementById(`day-${i}-temp`).textContent = `${maxT}°F`;
                    document.getElementById(`day-${i}-cond`).textContent = interpretWMO(code);
                    document.getElementById(`day-${i}-range`).textContent = `L: ${minT}° H: ${maxT}°`;
                }
            } catch (e) {
                document.getElementById("cur-cond").textContent = "OFFLINE";
            }
        }

        function initLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                        fetchExactCity(userCoords.lat, userCoords.lon);
                        fetchWeather(userCoords.lat, userCoords.lon);
                    },
                    () => {
                        cityElem.textContent = "LOCATION ACCESS OFF";
                        fetchWeather(34.6834, -82.8374);
                    },
                    { timeout: 10000 }
                );
            }
        }

        function getWeekNumber(d) {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        }

        function getDayOfYear(d) {
            const start = new Date(d.getFullYear(), 0, 0);
            const diff = (d - start) + ((start.getTimezoneOffset() - d.getTimezoneOffset()) * 60 * 1000);
            return Math.floor(diff / (1000 * 60 * 60 * 24));
        }

        function updateClockLoop() {
            const now = new Date();
            const minutes = now.getMinutes();

            if (minutes !== lastMinute) {
                lastMinute = minutes;
                updatePosition();
                
                if (minutes % 30 === 0 && userCoords) {
                    fetchWeather(userCoords.lat, userCoords.lon);
                }
            }

            const hrs = String(now.getHours()).padStart(2, "0");
            const mins = String(now.getMinutes()).padStart(2, "0");
            const secs = String(now.getSeconds()).padStart(2, "0");

            timeElem.textContent = `${hrs}:${mins}`;
            secsElem.textContent = `:${secs}`;

            const options = { weekday: "long", month: "long", day: "numeric", year: "numeric" };
            dateElem.textContent = now.toLocaleDateString("en-US", options);

            const isLeap = (now.getFullYear() % 4 === 0 && now.getFullYear() % 100 !== 0) || (now.getFullYear() % 400 === 0);
            weekElem.textContent = String(getWeekNumber(now)).padStart(2, "0");
            doyElem.textContent = `${String(getDayOfYear(now)).padStart(3, "0")}/${isLeap ? 366 : 365}`;

            requestAnimationFrame(updateClockLoop);
        }

        window.addEventListener("resize", updatePosition);

        initLocation();
        updatePosition();
        updateClockLoop();
    </script>
</body>
</html>
